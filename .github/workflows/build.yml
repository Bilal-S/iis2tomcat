name: Build

on:
  push:
    branches: [ master, fix/* ]
    tags: [ '1.*' ]
  pull_request:
    branches: [ master ]

env:
  LUCEE_INSTALLER_URL: https://cdn.lucee.org/lucee-7.0.2.106-windows-x64-installer.exe
  LUCEE_INSTALLER_EXE: lucee-7.0.2.106-windows-x64-installer.exe
  LUCEE_VERSION: 7.0.2.106

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore ConsoleTCPIP.sln

    - name: Inject version from tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $utf8Bom = New-Object System.Text.UTF8Encoding($true)

        # Connector version const (single occurrence)
        $enumsPath = "BonCodeAJP13/BonCodeAJP13Enums.cs"
        $enums = [IO.File]::ReadAllText($enumsPath)
        $enums = $enums -replace 'BONCODEAJP13_CONNECTOR_VERSION = "[^"]*"', "BONCODEAJP13_CONNECTOR_VERSION = `"$tag`""
        [IO.File]::WriteAllText($enumsPath, $enums, $utf8Bom)

        # DLL file version in both assembly infos
        foreach ($p in @("BonCodeAJP13/Properties/AssemblyInfo.cs", "BonCodeIIS/Properties/AssemblyInfo.cs")) {
          $t = [IO.File]::ReadAllText($p)
          $t = $t -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$tag.0`")"
          [IO.File]::WriteAllText($p, $t, $utf8Bom)
        }

        Write-Host "Injected connector version $tag from tag"

    - name: Build Release
      run: msbuild ConsoleTCPIP.sln /p:Configuration=Release /p:Platform="Any CPU" /m

    - name: Run unit tests
      run: dotnet test Connector.Tests/bin/Release/Connector.Tests.dll --logger "trx;LogFileName=unit-tests.trx" --results-directory TestResults

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results
        path: TestResults
        if-no-files-found: warn

    - name: Upload BonCode DLLs
      uses: actions/upload-artifact@v4
      with:
        name: BonCode-DLLs
        path: |
          BonCodeAJP13/bin/Release/BonCodeAJP13.dll
          BonCodeIIS/bin/Release/BonCodeIIS.dll
        if-no-files-found: error

  test-iis:
    runs-on: windows-latest
    needs: build
    steps:
    - name: Cache Lucee installer
      id: cache-lucee
      uses: actions/cache@v4
      with:
        path: ${{ env.LUCEE_INSTALLER_EXE }}
        key: lucee-installer-${{ env.LUCEE_VERSION }}

    - name: Download Lucee installer
      if: steps.cache-lucee.outputs.cache-hit != 'true'
      shell: cmd
      run: curl --fail -L -o %LUCEE_INSTALLER_EXE% %LUCEE_INSTALLER_URL%

    - name: Install IIS
      shell: powershell
      run: |
        Install-WindowsFeature -Name Web-Server
        Start-Service W3SVC
        Write-Host "IIS installed and running"

    - name: Run Lucee installer with IIS + BonCode
      shell: cmd
      run: |
        %LUCEE_INSTALLER_EXE% --mode unattended --installconn false --installmodcfml false --installiis true --startatboot true --luceepass ibtest --installjre true

    - name: Download patched BonCode DLLs
      uses: actions/download-artifact@v4
      with:
        name: BonCode-DLLs

    - name: Replace BonCode DLLs with patched build
      shell: powershell
      run: |
        # Stop IIS so DLLs aren't locked
        Stop-Service W3SVC
        Copy-Item BonCodeAJP13/bin/Release/BonCodeAJP13.dll c:\lucee\AJP13\BonCodeAJP13.dll -Force
        Copy-Item BonCodeIIS/bin/Release/BonCodeIIS.dll c:\lucee\AJP13\BonCodeIIS.dll -Force
        Start-Service W3SVC

    - name: Start Tomcat and wait
      shell: cmd
      run: |
        c:\lucee\tomcat\bin\startup.bat
        powershell -command "Start-Sleep -s 15"

    - name: Write test page
      shell: cmd
      run: |
        echo ^<cfscript^>if (server.lucee.version neq url.version) header statusCode=500;^</cfscript^>^<cfoutput^>Lucee #server.lucee.version#, Java #server.java.version#, #server.servlet.name#, OS #server.os.version# #server.os.arch#^</cfoutput^> > c:\lucee\tomcat\webapps\ROOT\check.cfm

    - name: Test Tomcat direct (port 8888)
      shell: cmd
      run: |
        echo "Check Tomcat port 8888" >> %GITHUB_STEP_SUMMARY%
        curl http://127.0.0.1:8888/check.cfm?version=%LUCEE_VERSION% --fail-with-body >> %GITHUB_STEP_SUMMARY%

    - name: Test IIS via BonCode (port 80)
      shell: cmd
      run: |
        echo "Check IIS port 80 via BonCode" >> %GITHUB_STEP_SUMMARY%
        curl http://127.0.0.1/check.cfm?version=%LUCEE_VERSION% --fail-with-body >> %GITHUB_STEP_SUMMARY%

    - name: debug failure
      if: ${{ failure() }}
      shell: cmd
      run: |
        echo "--- BonCode logs ---"
        if exist "c:\lucee\AJP13\BonCodeAJP13*.log" type c:\lucee\AJP13\BonCodeAJP13*.log
        echo "--- catalina.out ---"
        if exist "c:\lucee\tomcat\logs\catalina.out" type c:\lucee\tomcat\logs\catalina.out
        echo "--- install.log ---"
        if exist "c:\lucee\install.log" type c:\lucee\install.log
        echo "--- IIS BonCode DLLs ---"
        dir c:\lucee\AJP13\*.dll

  release:
    runs-on: windows-latest
    needs: [build, test-iis]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Download BonCode DLLs
      uses: actions/download-artifact@v4
      with:
        name: BonCode-DLLs

    - name: Verify DLL versions match tag
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        foreach ($dll in @("BonCodeAJP13/bin/Release/BonCodeAJP13.dll", "BonCodeIIS/bin/Release/BonCodeIIS.dll")) {
          $v = (Get-Item $dll).VersionInfo
          $fileVer = "$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart)"
          if ($fileVer -ne $tag) {
            Write-Error "$dll reports version $fileVer, expected $tag"
            exit 1
          }
          Write-Host "$dll version $fileVer matches tag $tag"
        }

    - name: Package DLLs
      shell: pwsh
      run: |
        $zip = "BonCode-DLLs-${{ github.ref_name }}.zip"
        Compress-Archive -Path BonCodeAJP13/bin/Release/BonCodeAJP13.dll, BonCodeIIS/bin/Release/BonCodeIIS.dll -DestinationPath $zip
        Write-Host "Packaged $zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: BonCode-DLLs-*.zip
        generate_release_notes: true

  # Version Sync: after a release publishes, commit the tag version back to
  # the source files (const + both AssemblyFileVersions) so the repo always
  # reflects the last released version. Skips the commit entirely when the
  # files already match the tag.
  version-sync:
    name: Version Sync
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
    - name: Checkout default branch
      uses: actions/checkout@v4
      with:
        ref: master

    - name: Sync version files to tag
      shell: pwsh
      run: |
        $tag = "${{ github.ref_name }}"
        $utf8Bom = New-Object System.Text.UTF8Encoding($true)
        $changed = $false

        $enumsPath = "BonCodeAJP13/BonCodeAJP13Enums.cs"
        $enums = [IO.File]::ReadAllText($enumsPath)
        $new = $enums -replace 'BONCODEAJP13_CONNECTOR_VERSION = "[^"]*"', "BONCODEAJP13_CONNECTOR_VERSION = `"$tag`""
        if ($new -ne $enums) { [IO.File]::WriteAllText($enumsPath, $new, $utf8Bom); $changed = $true }

        foreach ($p in @("BonCodeAJP13/Properties/AssemblyInfo.cs", "BonCodeIIS/Properties/AssemblyInfo.cs")) {
          $t = [IO.File]::ReadAllText($p)
          $n = $t -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$tag.0`")"
          if ($n -ne $t) { [IO.File]::WriteAllText($p, $n, $utf8Bom); $changed = $true }
        }

        if (-not $changed) {
          Write-Host "Version files already at $tag - nothing to sync"
          exit 0
        }

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add BonCodeAJP13/BonCodeAJP13Enums.cs BonCodeAJP13/Properties/AssemblyInfo.cs BonCodeIIS/Properties/AssemblyInfo.cs
        git commit -m "sync version to $tag"
        git push
        Write-Host "Synced version to $tag on master"
